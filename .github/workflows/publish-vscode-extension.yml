name: Publish VS Code Extension

# Publishes the extension under ./vscode-extension to the VS Code Marketplace.
#
# Runs on every push to master. If the version in vscode-extension/package.json
# is already published, the run skips gracefully. Bump that version to trigger
# an actual publish.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set +e
          output=$(npx vsce publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "::warning::This version is already published to the Marketplace, skipping."
              exit 0
            fi
            exit $status
          fi
